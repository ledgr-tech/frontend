name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# o CI só lê o código: sem isso o token herda o padrão da organização, que pode dar escrita (alerta do CodeQL)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fixadas pelo commit, não pela tag (que o dono da action pode mover); o Dependabot atualiza os dois juntos
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      # só as dependências que vão para produção, e só o que é alto ou crítico:
      # o resto vira PR do Dependabot sem travar o merge de ninguém
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # o caminho de todo mês (entrar, conciliar, justificar, fechar) de ponta a ponta, contra o
  # backend de mentira (scripts/backend-fake.mjs): pega o que os testes de unidade não pegam
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          LEDGR_API_URL: http://localhost:8000
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-trace
          path: test-results/
          retention-days: 7
