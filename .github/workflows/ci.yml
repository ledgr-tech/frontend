name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# o CI só lê o código: sem isso o token herda o padrão da organização, que pode dar escrita (alerta do CodeQL)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fixadas pelo commit, não pela tag (que o dono da action pode mover); o Dependabot atualiza os dois juntos
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      # só as dependências que vão para produção, e só o que é alto ou crítico:
      # o resto vira PR do Dependabot sem travar o merge de ninguém
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test
      - run: npm run build