# Atualizações de versão, uma vez por semana, em PRs contra a develop — o
# mesmo caminho de qualquer mudança (CI verde, PR para a develop, depois main).
# Menores e correções vêm num PR só por ecossistema; versão maior (Next 17,
# React 20) vem em PR separado, porque costuma pedir código.
#
# Os alertas e as atualizações de segurança são configuração do repositório
# (Settings → Code security), não deste arquivo, e abrem PR contra a main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    groups:
      actions:
        patterns: ["*"]
